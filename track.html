<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Track Order - RapidFeast</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    .step-active { color: #0d6efd; font-weight: bold; }
    .progress-bar-animated { animation: progress-bar-stripes 1s linear infinite; }
  </style>
</head>
<body class="bg-light">

  <nav class="navbar navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand fw-bold text-warning" href="index.html"><i class="fas fa-hamburger me-2"></i>RapidFeast Live Tracker</a>
      <a href="index.html" class="btn btn-outline-light btn-sm">Home</a>
    </div>
  </nav>

  <div class="container my-5">
    <div class="row g-4">
      <div class="col-lg-6">
        <div class="card shadow-sm border-0 p-4">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="fw-bold text-primary m-0">Live Order Status</h4>
            <span class="badge bg-success" id="orderIdBadge">RF-LIVE</span>
          </div>

          <div class="progress mb-4" style="height: 12px;">
            <div id="statusBar" class="progress-bar progress-bar-striped progress-bar-animated bg-success" style="width: 35%;"></div>
          </div>

          <ul class="list-group list-group-flush mb-4">
            <li class="list-group-item d-flex justify-content-between align-items-center" id="step1">
              <span><i class="fas fa-check-circle text-success me-2"></i>1. Order Received & Payment Verified</span>
              <small class="text-muted">Done</small>
            </li>
            <li class="list-group-item d-flex justify-content-between align-items-center step-active" id="step2">
              <span><i class="fas fa-fire-burner me-2 text-primary"></i>2. Kitchen Preparing Your Meal</span>
              <small class="badge bg-primary">In Progress</small>
            </li>
            <li class="list-group-item d-flex justify-content-between align-items-center text-muted" id="step3">
              <span><i class="fas fa-motorcycle me-2"></i>3. Out for Delivery</span>
              <small>Pending</small>
            </li>
            <li class="list-group-item d-flex justify-content-between align-items-center text-muted" id="step4">
              <span><i class="fas fa-house-chimney me-2"></i>4. Delivered</span>
              <small>Pending</small>
            </li>
          </ul>

          <div class="p-3 bg-light rounded" id="orderMeta">
            <p class="m-0 small text-muted">Estimated Delivery: <strong>20-25 Mins</strong></p>
          </div>
        </div>
      </div>

      <!-- Dynamic Delivery Map -->
      <div class="col-lg-6">
        <div class="card shadow-sm border-0 h-100">
          <div class="card-header bg-dark text-white fw-bold">
            <i class="fas fa-location-arrow text-warning me-2"></i>Rider Live GPS
          </div>
          <div class="card-body p-0">
            <iframe src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d444991.0356628712!2d78.14504059999999!3d29.38514645!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sin!4v1737012490258!5m2!1sen!2sin" 
                    width="100%" height="100%" style="border:0; min-height: 380px;" allowfullscreen="" loading="lazy"></iframe>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const savedOrder = JSON.parse(localStorage.getItem('rapid_active_order'));
    if(savedOrder) {
      document.getElementById('orderIdBadge').innerText = savedOrder.orderId;
      document.getElementById('orderMeta').innerHTML = `
        <p class="mb-1 small"><strong>Customer:</strong> ${savedOrder.customer}</p>
        <p class="mb-1 small"><strong>Address:</strong> ${savedOrder.address}</p>
        <p class="m-0 small"><strong>Amount Paid:</strong> ₹${savedOrder.total}</p>
      `;
    }

    // Step Simulator
    setTimeout(() => {
      document.getElementById('statusBar').style.width = '70%';
      document.getElementById('step2').classList.remove('step-active');
      document.getElementById('step2').querySelector('.badge').className = 'text-muted';
      document.getElementById('step2').querySelector('.badge').innerText = 'Done';
      document.getElementById('step3').className = 'list-group-item d-flex justify-content-between align-items-center step-active';
      document.getElementById('step3').innerHTML = '<span><i class="fas fa-motorcycle me-2 text-primary"></i>3. Out for Delivery</span><small class="badge bg-primary">On the way</small>';
    }, 5000);
  </script>
</body>
</html>
