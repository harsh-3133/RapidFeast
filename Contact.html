<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - RapidFeast</title>
  <link rel="stylesheet" href="style1.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <header class="bg-dark text-white p-3 sticky-top">
    <nav class="navbar navbar-expand-lg navbar-dark container">
      <a class="navbar-brand fw-bold text-warning" href="index.html">
        <i class="fas fa-hamburger me-2"></i>RapidFeast
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto gap-2">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="Menu.html">Menu</a></li>
          <li class="nav-item"><a class="nav-link" href="Order.html">Order Online</a></li>
          <li class="nav-item"><a class="nav-link active text-warning" href="Contact.html">Contact</a></li>
        </ul>
      </div>
    </nav>
  </header>

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-6">
        <div class="card shadow border-0 p-4">
          <h3 class="fw-bold text-primary mb-3">Get In Touch</h3>
          <p class="text-muted small mb-4">Have feedback, catering inquiries, or general questions? Drop a message!</p>
          <form id="contactForm">
            <div class="mb-3">
              <label class="form-label fw-bold small">Your Name</label>
              <input type="text" class="form-control" required placeholder="John Doe">
            </div>
            <div class="mb-3">
              <label class="form-label fw-bold small">Email Address</label>
              <input type="email" class="form-control" required placeholder="john@example.com">
            </div>
            <div class="mb-3">
              <label class="form-label fw-bold small">Message</label>
              <textarea class="form-control" rows="4" required placeholder="Write your message here..."></textarea>
            </div>
            <button type="submit" class="btn btn-primary w-100 fw-bold">Send Message</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('contactForm').addEventListener('submit', (e) => {
      e.preventDefault();
      alert('Thank you! Your message has been sent successfully.');
      e.target.reset();
    });
  </script>
</body>
</html>
